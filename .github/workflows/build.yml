name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restaurer les packages
        run: dotnet restore Mondje.slnx

      - name: Compiler (warnings = erreurs)
        run: dotnet build Mondje.slnx --configuration Release --no-restore

      - name: Verifier le format des fichiers projet
        run: dotnet sln Mondje.slnx list
