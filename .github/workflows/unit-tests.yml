name: unit-tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Tests unitaires et d'integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restaurer les packages
        run: dotnet restore Mondje.slnx

      - name: Compiler
        run: dotnet build Mondje.slnx --configuration Release --no-restore

      - name: Tests du domaine
        run: >
          dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=domain.trx"
          --results-directory artifacts/test-results/domain

      - name: Tests de la couche Application
        run: >
          dotnet test tests/Application.UnitTests/Application.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=application.trx"
          --results-directory artifacts/test-results/application

      - name: Tests d'integration Infrastructure
        run: >
          dotnet test tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=infrastructure.trx"
          --results-directory artifacts/test-results/infrastructure

      - name: Publier les resultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/test-results
          retention-days: 14
